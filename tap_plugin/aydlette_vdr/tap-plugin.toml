manifest_version = "0"
plugin_version = "0.1.0"
requires_tap = ">=0.3.1"
slug = "aydlette_vdr"
name = "Aydlette VDR"
description = "The vulnerability-evidence method for FedRAMP VDR (samaydlette.com/research/vulnerability-evidence.html): declared exposure and classification reconciled with observations (Figure 6), Figure 7 LEV, a three-layer PAIN with governed profiles, dispositions with review dates, the clock and gates G1-G5 and G7."

depends_on = [
    { slug = "fedramp_20x_vdr", note = "import dependency: timeframe rows (deadline_hours, acceptance_hours), the PAIN levels and reach_rows for package findings. Vocabulary dependency: the vdr_evaluations collector writes vdr_evaluation nodes of scheme aydlette and their EVALUATES_COMPLIANCE_FINDING and CITES_FACTOR_EVIDENCE edges." },
    { slug = "compliance_core", note = "import dependency: findings, vulnerability records (CVSS, KEV, EPSS, SSVC) and CARRIES_COMPLIANCE_FINDING." },
]

